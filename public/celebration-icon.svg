<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Ribbon Outer Gradient -->
    <linearGradient id="c-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Star Core Gradient -->
    <linearGradient id="c-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="c-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect width="64" height="64" rx="16" fill="url(#c-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Celebration Ribbon Arc (Fluid 'C' Monogram) -->
  <path
    d="M 46 16.5 C 38 9, 21 10, 14 21 C 8 30.5, 11 44, 23 50 C 33 55, 45 49, 47 41.5 C 47.8 38.5, 43.5 37, 41.5 39 C 37 43.5, 28.5 45, 21.5 41 C 15.5 37.5, 14 29.5, 18 22.5 C 22.5 15, 34 13.5, 41.5 18.5 C 43.5 20, 47.5 18.5, 46 16.5 Z"
    fill="url(#c-ribbon)"
    filter="url(#c-glow)"
  />

  <!-- Radiant AI Nova Star (Center) -->
  <path
    d="M 33 16 C 33 23, 36 26.5, 43 27 C 44.5 27.2, 44.5 30.8, 43 31 C 36 31.5, 33 35, 33 42 C 32.5 43.5, 29.5 43.5, 29 42 C 29 35, 26 31.5, 19 31 C 17.5 30.8, 17.5 27.2, 19 27 C 26 26.5, 29 23, 29 16 C 29.5 14.5, 32.5 14.5, 33 16 Z"
    fill="url(#c-star)"
    filter="url(#c-glow)"
  />

  <!-- Specular Shimmer Center Point -->
  <circle cx="31" cy="29" r="2.8" fill="#ffffff" />

  <!-- Celebration Champagne Accents -->
  <!-- Top Right Sparkle -->
  <path
    d="M 50 8 C 50 11, 51.5 12.5, 54 13 C 51.5 13.5, 50 15, 50 18 C 50 15, 48.5 13.5, 46 13 C 48.5 12.5, 50 11, 50 8 Z"
    fill="#fef08a"
  />
  <circle cx="50" cy="13" r="1" fill="#ffffff" />

  <!-- Floating Micro Spheres (Effervescence) -->
  <circle cx="16" cy="14" r="2" fill="#38bdf8" fill-opacity="0.9" />
  <circle cx="51" cy="48" r="2.2" fill="#fb7185" fill-opacity="0.9" />
  <circle cx="28" cy="10" r="1.2" fill="#fef08a" fill-opacity="0.8" />
  <circle cx="48" cy="33" r="1.4" fill="#a7f3d0" fill-opacity="0.8" />
</svg>
